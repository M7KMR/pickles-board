<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickles Board</title>
<script src="data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f1a;
    color: #f0f0f0;
    padding: 32px;
    /* Contain any horizontal overflow without creating a scroll container.
       `overflow-x: hidden` here breaks vertical/momentum scroll on iOS Safari;
       `clip` clips without that side effect. */
    overflow-x: clip;
  }
  @media (max-width: 640px) { body { padding: 16px; } }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #a8ff78, #78ffd6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  @media (max-width: 640px) { .header h1 { font-size: 2rem; } }

  .header .subtitle { color: #888; margin-top: 4px; font-size: 0.9rem; }

  .since-line {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #aaa;
  }
  .since-line .pos { font-weight: 700; }
  .since-line .neg { font-weight: 700; }

  .portfolio-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  @media (max-width: 640px) { .portfolio-stats { grid-template-columns: repeat(2, 1fr); } }

  .stat {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
  }
  .stat-label { font-size: 0.68rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
  @media (max-width: 640px) { .stat-value { font-size: 1.1rem; } }

  /* ── SECTION TITLES ── */
  .section-title {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, #2a2a4a, transparent);
  }

  /* ── LEADERBOARD ── */
  .leaderboard {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  @media (max-width: 900px)  { .leaderboard { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px)  { .leaderboard { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  .chooser-card {
    border-radius: 16px;
    padding: 20px 14px;
    text-align: center;
    position: relative;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s, box-shadow 0.15s;
    user-select: none;
  }
  @media (max-width: 640px) { .chooser-card { padding: 16px 10px; border-radius: 12px; } }

  .chooser-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .chooser-card.rank-1 { border-color: gold; }
  .chooser-card.rank-2 { border-color: silver; }
  .chooser-card.rank-3 { border-color: #cd7f32; }
  .chooser-card.active { box-shadow: 0 0 0 3px #fff4, 0 8px 24px rgba(0,0,0,0.4); transform: translateY(-4px); }
  .chooser-card.dimmed { opacity: 0.35; transform: none; }

  .rank-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.3rem;
  }
  .rank-move {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1;
  }
  .rank-move.up   { color: #4ade80; }
  .rank-move.down { color: #f87171; }
  .rank-move.flat { color: rgba(255,255,255,0.35); }

  .chooser-emoji { font-size: 2.2rem; margin-bottom: 6px; }
  .chooser-name  { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .chooser-avg   { font-size: 1.9rem; font-weight: 900; line-height: 1; margin-bottom: 6px; }
  .chooser-total { font-size: 0.78rem; color: rgba(255,255,255,0.7); }
  .chooser-picks { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 4px; }

  @media (max-width: 640px) {
    .chooser-emoji { font-size: 1.8rem; }
    .chooser-avg   { font-size: 1.5rem; }
    .chooser-name  { font-size: 0.8rem; margin-bottom: 6px; }
    .chooser-total { font-size: 0.7rem; }
    .chooser-picks { font-size: 0.66rem; }
  }

  .c-ben    { background: linear-gradient(160deg, #1a3a1a, #2d6a2d); }
  .c-baz    { background: linear-gradient(160deg, #1a2a3a, #2d4a7a); }
  .c-willis { background: linear-gradient(160deg, #3a2a1a, #7a5a1a); }
  .c-rick   { background: linear-gradient(160deg, #2a1a3a, #5a2a7a); }
  .c-harps  { background: linear-gradient(160deg, #3a3a1a, #7a7a1a); }
  .c-gammy  { background: linear-gradient(160deg, #3a1a2a, #7a2a5a); }

  /* ── FILTER HINT ── */
  .filter-hint {
    text-align: center;
    font-size: 0.78rem;
    color: #555;
    margin-top: -20px;
    margin-bottom: 28px;
  }

  /* ── BEST / WORST ── */
  .fame-shame {
    display: grid;
    /* minmax(0, 1fr) lets tracks shrink below their content's min-width;
       a plain 1fr (== minmax(auto, 1fr)) refuses to, forcing overflow. */
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }
  @media (max-width: 640px) { .fame-shame { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

  .fame-panel, .shame-panel {
    background: #1a1a2e;
    border-radius: 16px;
    padding: 20px;
    overflow: hidden;
    min-width: 0;
  }
  @media (max-width: 640px) { .fame-panel, .shame-panel { padding: 14px; } }
  .fame-panel  { border: 1px solid #2a5a2a; }
  .shame-panel { border: 1px solid #5a2a2a; }
  .panel-title { font-size: 1rem; font-weight: 800; margin-bottom: 14px; }

  .pick-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #2a2a4a;
  }
  .pick-row:last-child { border-bottom: none; }
  .pick-rank { font-size: 1.3rem; width: 28px; text-align: center; flex-shrink: 0; }
  .pick-info { flex: 1; min-width: 0; }
  .pick-name { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-meta { font-size: 0.72rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-journey { font-size: 0.72rem; color: #777; margin-top: 3px; }
  .pick-right { flex-shrink: 0; text-align: right; }
  .pick-pct  { font-size: 1.2rem; font-weight: 900; white-space: nowrap; }
  .pick-gbp  { font-size: 0.72rem; color: #aaa; text-align: right; white-space: nowrap; }

  @media (max-width: 640px) {
    .pick-row  { flex-wrap: wrap; gap: 4px 8px; }
    .pick-rank { align-self: flex-start; padding-top: 2px; }
    .pick-info { flex-basis: 0; }
    .pick-right {
      flex-basis: 100%;
      padding-left: 36px; /* lines up under the name (rank width + gap) */
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .pick-pct { font-size: 1.1rem; }
    .pick-gbp { font-size: 0.72rem; margin-top: 0; }
  }

  /* ── TABLE CONTROLS ── */
  .table-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1a1a2e;
    border: 1px solid #3a3a6a;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    color: #ccc;
  }
  .clear-filter {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0 0 0 4px;
    transition: color 0.15s;
  }
  .clear-filter:hover { color: #fff; }
  .filter-badge.hidden { display: none; }
  .stocks-count { font-size: 0.78rem; color: #666; margin-left: auto; }

  /* ── TABLE (desktop) ── */
  .stocks-table-wrap {
    background: #1a1a2e;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2a2a4a;
  }
  @media (max-width: 640px) { .stocks-table-wrap { display: none; } }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    background: #12122a;
    padding: 12px 16px;
    text-align: left;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: color 0.15s;
  }
  thead th:hover { color: #ccc; }
  thead th.num { text-align: right; }
  thead th .sort-arrow { margin-left: 4px; opacity: 0.4; }
  thead th.sort-asc  .sort-arrow::after { content: '↑'; opacity: 1; }
  thead th.sort-desc .sort-arrow::after { content: '↓'; opacity: 1; }
  thead th:not(.sort-asc):not(.sort-desc) .sort-arrow::after { content: '↕'; }

  tbody tr { border-bottom: 1px solid #1e1e38; transition: background 0.1s; }
  tbody tr:hover { background: #1e1e38; }
  tbody td { padding: 10px 16px; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ── STOCK CARDS (mobile) ── */
  .stock-cards { display: none; }
  @media (max-width: 640px) { .stock-cards { display: flex; flex-direction: column; gap: 8px; } }

  .stock-card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sc-left  { flex: 1; min-width: 0; }
  .sc-name  { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-bottom { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .sc-ticker { font-family: monospace; font-size: 0.72rem; color: #666; flex-shrink: 0; }
  .sc-right { text-align: right; flex-shrink: 0; }
  .sc-pct   { font-size: 1.2rem; font-weight: 900; white-space: nowrap; }
  .sc-gbp   { font-size: 0.72rem; color: #aaa; margin-top: 2px; white-space: nowrap; }

  /* ── SHARED ── */
  .gain { color: #4ade80; }
  .loss { color: #f87171; }
  .flat { color: #aaa; }
  .unknown { color: #555; }

  .exited-note {
    font-size: 0.78rem;
    color: #666;
    margin-top: -8px;
    margin-bottom: 16px;
  }
  .pos  { color: #4ade80; }
  .neg  { color: #f87171; }

  .chooser-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .chooser-chip:hover { opacity: 0.8; }
  .chip-ben     { background: #2d6a2d33; color: #86efac; border: 1px solid #2d6a2d; }
  .chip-baz     { background: #2d4a7a33; color: #93c5fd; border: 1px solid #2d4a7a; }
  .chip-willis  { background: #7a5a1a33; color: #fcd34d; border: 1px solid #7a5a1a; }
  .chip-rick    { background: #5a2a7a33; color: #c4b5fd; border: 1px solid #5a2a7a; }
  .chip-harps   { background: #7a7a1a33; color: #fde68a; border: 1px solid #7a7a1a; }
  .chip-gammy   { background: #7a2a5a33; color: #f9a8d4; border: 1px solid #7a2a5a; }
  .chip-unknown { background: #33333333; color: #aaa;    border: 1px solid #555; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function() {
  const D = window.DATA;
  const chooserMap = {};
  D.choosers.forEach(c => chooserMap[c.id] = c);

  function fmt(n, d=2)  { return (n >= 0 ? '+' : '-') + Math.abs(n).toFixed(d); }
  function fmtPct(n)    { return fmt(n) + '%'; }
  function fmtGbp(n)    { return (n >= 0 ? '+£' : '-£') + Math.abs(n).toFixed(2); }
  function colorCls(n)  { return n > 0 ? 'gain' : n < 0 ? 'loss' : 'flat'; }
  function signCls(n)   { return n > 0 ? 'pos'  : n < 0 ? 'neg'  : ''; }

  // ── Chooser stats ──
  const chooserStats = {};
  D.choosers.forEach(c => { chooserStats[c.id] = { ...c, pcts: [], totalChange: 0, picks: 0 }; });
  D.stocks.forEach(s => {
    if (!s.chooser || !chooserStats[s.chooser]) return;
    const cs = chooserStats[s.chooser];
    cs.pcts.push(s.changePct);
    cs.totalChange += s.change;
    cs.picks++;
  });
  const ranked = Object.values(chooserStats)
    .map(cs => ({ ...cs, avgPct: cs.pcts.length ? cs.pcts.reduce((a,b)=>a+b,0)/cs.pcts.length : 0 }))
    .sort((a,b) => b.avgPct - a.avgPct);

  const medals     = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
  const shameIcons = ['💩','😬','😅'];

  const sortedByPct = [...D.stocks].sort((a,b) => b.changePct - a.changePct);
  const top3 = sortedByPct.slice(0,3);
  const bot3 = sortedByPct.slice(-3).reverse();

  // ── Since-last-update comparison (optional; only if D.previous exists) ──
  const prev = D.previous || null;
  let prevRankById = {};       // chooser id -> previous rank (0-based)
  let prevAvgById  = {};       // chooser id -> previous avg %
  let movers       = [];       // stocks with biggest % move since last time
  let headline     = null;     // portfolio-level delta

  if (prev) {
    // Previous per-ticker return, keyed by ticker
    const prevPctByTicker = {};
    prev.stocks.forEach(s => { prevPctByTicker[s.ticker] = s.changePct; });

    // Previous chooser leaderboard (same avg-of-%-returns method as current)
    const prevStats = {};
    D.choosers.forEach(c => { prevStats[c.id] = []; });
    prev.stocks.forEach(s => {
      if (prevStats[s.chooser]) prevStats[s.chooser].push(s.changePct);
    });
    const prevRanked = Object.keys(prevStats)
      .map(id => ({ id, avgPct: prevStats[id].length ? prevStats[id].reduce((a,b)=>a+b,0)/prevStats[id].length : 0 }))
      .sort((a,b) => b.avgPct - a.avgPct);
    prevRanked.forEach((r,i) => { prevRankById[r.id] = i; prevAvgById[r.id] = r.avgPct; });

    // Per-stock movers: delta in % return since last update (held in both snapshots)
    movers = D.stocks
      .filter(s => prevPctByTicker[s.ticker] !== undefined)
      .map(s => ({ ...s, prevPct: prevPctByTicker[s.ticker], delta: s.changePct - prevPctByTicker[s.ticker] }))
      .sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));

    // Headline portfolio delta
    headline = {
      valueDelta:  D.portfolio.totalValue     - prev.portfolio.totalValue,
      returnDelta: D.portfolio.totalChangePct  - prev.portfolio.totalChangePct,
      asOf: prev.asOf
    };
  }

  const prettyDate = iso => {
    const [y,m,d] = iso.split('-').map(Number);
    const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${mn[m-1]}`;
  };

  // Rank-movement indicator vs previous leaderboard
  function rankMove(id, curRank) {
    if (!prev || prevRankById[id] === undefined) return '';
    const diff = prevRankById[id] - curRank;   // positive = climbed
    if (diff > 0) return `<span class="rank-move up">▲${diff}</span>`;
    if (diff < 0) return `<span class="rank-move down">▼${-diff}</span>`;
    return `<span class="rank-move flat">=</span>`;
  }

  const topMovers = movers.filter(m => m.delta > 0).slice(0,3);
  const botMovers = movers.filter(m => m.delta < 0).slice(0,3);

  // ── State ──
  let activeChooser = null;
  let sortCol = 'changePct';
  let sortDir = 'desc';

  // ── Build static HTML ──
  const p = D.portfolio;
  const isMobile = () => window.innerWidth <= 640;

  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" style="height:1em;flex-shrink:0" aria-hidden="true">
          <ellipse cx="32" cy="32" rx="14" ry="26" fill="#4a9e4a"/>
          <ellipse cx="32" cy="32" rx="10" ry="22" fill="#5dbc5d"/>
          <ellipse cx="26" cy="20" rx="3.5" ry="2" fill="#3a7a3a" transform="rotate(-20 26 20)"/>
          <ellipse cx="38" cy="26" rx="3.5" ry="2" fill="#3a7a3a" transform="rotate(15 38 26)"/>
          <ellipse cx="25" cy="34" rx="3.5" ry="2" fill="#3a7a3a" transform="rotate(-10 25 34)"/>
          <ellipse cx="39" cy="40" rx="3.5" ry="2" fill="#3a7a3a" transform="rotate(20 39 40)"/>
          <ellipse cx="28" cy="46" rx="3" ry="1.8" fill="#3a7a3a" transform="rotate(-15 28 46)"/>
          <ellipse cx="32" cy="8" rx="6" ry="4" fill="#7acc5a"/>
          <ellipse cx="32" cy="56" rx="6" ry="4" fill="#7acc5a"/>
        </svg>
        Pickles Board
      </h1>
      <div class="subtitle">Portfolio snapshot · ${p.asOf}</div>
      ${headline ? `
      <div class="since-line">
        Since last update (${prettyDate(headline.asOf)}):
        <span class="${signCls(headline.valueDelta)}">${fmtGbp(headline.valueDelta)}</span> value ·
        <span class="${signCls(headline.returnDelta)}">${fmtPct(headline.returnDelta)}</span> return
      </div>` : ''}
      <div class="portfolio-stats">
        <div class="stat">
          <div class="stat-label">Total Value</div>
          <div class="stat-value">£${p.totalValue.toLocaleString('en-GB',{minimumFractionDigits:2})}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total Cost</div>
          <div class="stat-value" style="color:#aaa">£${p.totalCost.toLocaleString('en-GB',{minimumFractionDigits:2})}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Gain / Loss</div>
          <div class="stat-value ${signCls(p.totalChange)}">${fmtGbp(p.totalChange)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Return</div>
          <div class="stat-value ${signCls(p.totalChangePct)}">${fmtPct(p.totalChangePct)}</div>
        </div>
      </div>
    </div>

    <div class="section-title">🏆 Leaderboard</div>
    <div class="leaderboard" id="leaderboard">
      ${ranked.map((cs,i) => `
        <div class="chooser-card c-${cs.id} rank-${i+1}" data-id="${cs.id}">
          <div class="rank-badge">${medals[i]}</div>
          <div class="chooser-emoji">${cs.emoji}</div>
          <div class="chooser-name">${cs.name}</div>
          <div class="chooser-avg ${signCls(cs.avgPct)}">${fmtPct(cs.avgPct)}</div>
          <div class="chooser-total ${signCls(cs.totalChange)}">${fmtGbp(cs.totalChange)} total</div>
          <div class="chooser-picks">${cs.picks} pick${cs.picks!==1?'s':''}</div>
          ${rankMove(cs.id, i)}
        </div>`).join('')}
    </div>
    <div class="filter-hint">Tap a card to filter · tap again to clear</div>

    <div class="section-title">📊 Hall of Fame &amp; Shame</div>
    <div class="fame-shame">
      <div class="fame-panel">
        <div class="panel-title">🏆 Top Picks</div>
        ${top3.map((s,i) => {
          const c = s.chooser ? chooserMap[s.chooser] : null;
          return `<div class="pick-row">
            <div class="pick-rank">${medals[i]}</div>
            <div class="pick-info">
              <div class="pick-name">${s.name}</div>
              <div class="pick-meta">${s.ticker} · ${c ? c.emoji+' '+c.name : '❓'}</div>
            </div>
            <div class="pick-right">
              <div class="pick-pct gain">${fmtPct(s.changePct)}</div>
              <div class="pick-gbp gain">${fmtGbp(s.change)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="shame-panel">
        <div class="panel-title">💀 Biggest Losses</div>
        ${bot3.map((s,i) => {
          const c = s.chooser ? chooserMap[s.chooser] : null;
          return `<div class="pick-row">
            <div class="pick-rank">${shameIcons[i]}</div>
            <div class="pick-info">
              <div class="pick-name">${s.name}</div>
              <div class="pick-meta">${s.ticker} · ${c ? c.emoji+' '+c.name : '❓'}</div>
            </div>
            <div class="pick-right">
              <div class="pick-pct loss">${fmtPct(s.changePct)}</div>
              <div class="pick-gbp loss">${fmtGbp(s.change)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    ${prev ? `
    <div class="section-title">📈 Biggest Movers <span style="font-size:0.8rem;font-weight:600;color:#666">since ${prettyDate(prev.asOf)}</span></div>
    <div class="fame-shame">
      <div class="fame-panel">
        <div class="panel-title">🚀 On the Up</div>
        ${topMovers.length ? topMovers.map((s,i) => {
          const c = s.chooser ? chooserMap[s.chooser] : null;
          return `<div class="pick-row">
            <div class="pick-rank">${['🥇','🥈','🥉'][i]}</div>
            <div class="pick-info">
              <div class="pick-name">${s.name}</div>
              <div class="pick-meta">${s.ticker} · ${c ? c.emoji+' '+c.name : '❓'}</div>
              <div class="pick-journey">was <span class="${signCls(s.prevPct)}">${fmtPct(s.prevPct)}</span> (${prettyDate(prev.asOf)}) → now <span class="${signCls(s.changePct)}">${fmtPct(s.changePct)}</span> (${prettyDate(D.portfolio.asOf)})</div>
            </div>
            <div class="pick-right">
              <div class="pick-pct gain">${fmt(s.delta,1)}</div>
              <div class="pick-gbp">pts</div>
            </div>
          </div>`;
        }).join('') : '<div class="pick-meta">No risers this period</div>'}
      </div>
      <div class="shame-panel">
        <div class="panel-title">📉 On the Slide</div>
        ${botMovers.length ? botMovers.map((s,i) => {
          const c = s.chooser ? chooserMap[s.chooser] : null;
          return `<div class="pick-row">
            <div class="pick-rank">${['💩','😬','😅'][i]}</div>
            <div class="pick-info">
              <div class="pick-name">${s.name}</div>
              <div class="pick-meta">${s.ticker} · ${c ? c.emoji+' '+c.name : '❓'}</div>
              <div class="pick-journey">was <span class="${signCls(s.prevPct)}">${fmtPct(s.prevPct)}</span> (${prettyDate(prev.asOf)}) → now <span class="${signCls(s.changePct)}">${fmtPct(s.changePct)}</span> (${prettyDate(D.portfolio.asOf)})</div>
            </div>
            <div class="pick-right">
              <div class="pick-pct loss">${fmt(s.delta,1)}</div>
              <div class="pick-gbp">pts</div>
            </div>
          </div>`;
        }).join('') : '<div class="pick-meta">No fallers this period</div>'}
      </div>
    </div>
    ` : ''}

    <div class="section-title">📋 All Stocks</div>
    <div class="table-controls">
      <div class="filter-badge hidden" id="filterBadge">
        Showing: <span id="filterLabel"></span>
        <button class="clear-filter" id="clearFilter" title="Clear filter">✕</button>
      </div>
      <div class="stocks-count" id="stocksCount"></div>
    </div>

    <div class="stocks-table-wrap">
      <table id="stocksTable">
        <thead>
          <tr>
            <th data-col="name">Stock <span class="sort-arrow"></span></th>
            <th data-col="ticker">Ticker <span class="sort-arrow"></span></th>
            <th data-col="chooser">Chooser <span class="sort-arrow"></span></th>
            <th data-col="cost"      class="num">Cost (£) <span class="sort-arrow"></span></th>
            <th data-col="value"     class="num">Value (£) <span class="sort-arrow"></span></th>
            <th data-col="change"    class="num">Change (£) <span class="sort-arrow"></span></th>
            <th data-col="changePct" class="num sort-desc">Change (%) <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="stocksTbody"></tbody>
      </table>
    </div>

    <div class="stock-cards" id="stockCards"></div>

    ${(D.exited && D.exited.length) ? `
    <div class="section-title" style="margin-top:40px">🚪 Exited Positions</div>
    <div class="exited-note">Sold and no longer held · cost &amp; exit price not tracked</div>

    <div class="stocks-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Stock</th>
            <th>Ticker</th>
            <th>Chooser</th>
            <th class="num">Cost (£)</th>
            <th class="num">Value (£)</th>
            <th class="num">Change (£)</th>
            <th class="num">Change (%)</th>
          </tr>
        </thead>
        <tbody>
          ${D.exited.map(s => {
            const c = s.chooser ? chooserMap[s.chooser] : null;
            const cls   = c ? `chip-${c.id}` : 'chip-unknown';
            const label = c ? `${c.emoji} ${c.name}` : '❓ Unknown';
            return `<tr>
              <td>${s.name}</td>
              <td style="color:#888;font-family:monospace;font-size:0.8rem">${s.ticker}</td>
              <td><span class="chooser-chip ${cls}">${label}</span></td>
              <td class="num unknown">?</td>
              <td class="num unknown">?</td>
              <td class="num unknown">?</td>
              <td class="num unknown">?</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="stock-cards">
      ${D.exited.map(s => {
        const c = s.chooser ? chooserMap[s.chooser] : null;
        const cls   = c ? `chip-${c.id}` : 'chip-unknown';
        const label = c ? `${c.emoji} ${c.name}` : '❓ Unknown';
        return `<div class="stock-card">
          <div class="sc-left">
            <div class="sc-name">${s.name}</div>
            <div class="sc-bottom">
              <span class="sc-ticker">${s.ticker}</span>
              <span class="chooser-chip ${cls}">${label}</span>
            </div>
          </div>
          <div class="sc-right">
            <div class="sc-pct unknown">?</div>
            <div class="sc-gbp unknown">exited</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    ` : ''}
  `;

  // ── Render stocks (table + cards) ──
  function renderStocks() {
    const cols = {
      name:      s => s.name,
      ticker:    s => s.ticker,
      chooser:   s => (s.chooser ? chooserMap[s.chooser].name : 'Unknown'),
      cost:      s => s.cost,
      value:     s => s.value,
      change:    s => s.change,
      changePct: s => s.changePct,
    };

    const sorted = [...D.stocks].sort((a,b) => {
      const va = cols[sortCol](a), vb = cols[sortCol](b);
      const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      return sortDir === 'asc' ? cmp : -cmp;
    });

    const visible = activeChooser ? sorted.filter(s => s.chooser === activeChooser) : sorted;

    function chip(s) {
      const c = s.chooser ? chooserMap[s.chooser] : null;
      const cls   = c ? `chip-${c.id}` : 'chip-unknown';
      const label = c ? `${c.emoji} ${c.name}` : '❓ Unknown';
      return `<span class="chooser-chip ${cls}" data-chooser="${s.chooser||''}">${label}</span>`;
    }

    // Table rows
    document.getElementById('stocksTbody').innerHTML = visible.map(s => `
      <tr>
        <td>${s.name}</td>
        <td style="color:#888;font-family:monospace;font-size:0.8rem">${s.ticker}</td>
        <td>${chip(s)}</td>
        <td class="num">£${s.cost.toFixed(2)}</td>
        <td class="num">£${s.value.toFixed(2)}</td>
        <td class="num ${colorCls(s.change)}">${fmtGbp(s.change)}</td>
        <td class="num ${colorCls(s.changePct)}">${fmtPct(s.changePct)}</td>
      </tr>`).join('');

    // Mobile cards
    document.getElementById('stockCards').innerHTML = visible.map(s => `
      <div class="stock-card">
        <div class="sc-left">
          <div class="sc-name">${s.name}</div>
          <div class="sc-bottom">
            <span class="sc-ticker">${s.ticker}</span>
            ${chip(s)}
          </div>
        </div>
        <div class="sc-right">
          <div class="sc-pct ${colorCls(s.changePct)}">${fmtPct(s.changePct)}</div>
          <div class="sc-gbp ${colorCls(s.change)}">${fmtGbp(s.change)}</div>
        </div>
      </div>`).join('');

    // Sort arrows
    document.querySelectorAll('#stocksTable thead th').forEach(th => {
      th.classList.remove('sort-asc','sort-desc');
      if (th.dataset.col === sortCol) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    });

    // Count
    document.getElementById('stocksCount').textContent = activeChooser
      ? `${visible.length} of ${D.stocks.length} stocks`
      : `${D.stocks.length} stocks`;
  }

  // ── Filter ──
  function setFilter(id) {
    activeChooser = id;
    const badge = document.getElementById('filterBadge');
    const label = document.getElementById('filterLabel');
    const cards = document.querySelectorAll('.chooser-card');
    if (id) {
      const c = chooserMap[id];
      label.textContent = `${c.emoji} ${c.name}`;
      badge.classList.remove('hidden');
      cards.forEach(card => {
        card.classList.toggle('active', card.dataset.id === id);
        card.classList.toggle('dimmed', card.dataset.id !== id);
      });
    } else {
      badge.classList.add('hidden');
      cards.forEach(card => card.classList.remove('active','dimmed'));
    }
    renderStocks();
  }

  // ── Events ──
  document.getElementById('leaderboard').addEventListener('click', e => {
    const card = e.target.closest('.chooser-card');
    if (!card) return;
    setFilter(activeChooser === card.dataset.id ? null : card.dataset.id);
  });

  document.getElementById('clearFilter').addEventListener('click', () => setFilter(null));

  function chipClickHandler(e) {
    const chip = e.target.closest('.chooser-chip');
    if (!chip || !chip.dataset.chooser) return;
    setFilter(activeChooser === chip.dataset.chooser ? null : chip.dataset.chooser);
  }
  document.getElementById('stocksTbody').addEventListener('click', chipClickHandler);
  document.getElementById('stockCards').addEventListener('click', chipClickHandler);

  document.querySelectorAll('#stocksTable thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      sortDir = sortCol === col ? (sortDir === 'asc' ? 'desc' : 'asc')
                                : (['cost','value','change','changePct'].includes(col) ? 'desc' : 'asc');
      sortCol = col;
      renderStocks();
    });
  });

  renderStocks();
})();
</script>
</body>
</html>
